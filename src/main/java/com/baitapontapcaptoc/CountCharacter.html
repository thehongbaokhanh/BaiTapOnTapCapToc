<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function countCharacter(arr, character) {
        let count = 0;

        for (let i = 0; i < arr.length; i++) {
            if (arr[i] === character) {
                count++;
            }
        }

        if (count > 0) {
            return count;
        }

        return -1;
    }

    let arr = ["a", "b", "c", "a", "d", "a"];

    document.write(countCharacter(arr, "a"));
</script>
</body>
</html>
