<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<script>
    function areaCircle(radius) {
        return Math.PI * radius * radius;
    }

    function perimeterCircle(radius) {
        return 2 * Math.PI * radius;
    }

    document.write("Diện tích: " + areaCircle(5) + "<br>");
    document.write("Chu vi: " + perimeterCircle(5));
</script>
</html>
