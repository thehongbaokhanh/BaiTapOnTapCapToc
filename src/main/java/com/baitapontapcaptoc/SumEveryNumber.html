<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let i;
    let sum = 0;
    while(i !== -1) {
        i = parseInt(prompt("Please enter a number: "));
        if (i !== -1) {
            sum += i;
        }
    }
    alert("Sum is: " + sum);
</script>
</body>
</html>
