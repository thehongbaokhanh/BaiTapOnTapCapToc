<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<p id="demo"></p>
</body>
<script>
    let n = parseInt(prompt("Please enter a number: "));
    let result = 0;
    for (let i = 1; i <= n; i++) {
        result += i;
    }
    document.getElementById("demo").innerHTML = "Sum from 1 to " + n + " is: " + result;
</script>
</html>
