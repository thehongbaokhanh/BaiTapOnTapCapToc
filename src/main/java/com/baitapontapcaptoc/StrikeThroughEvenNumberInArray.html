<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
  let a = [1, 3, 5, 6, 7, 8, 10, 30, 40, 50, 78, 90, 100];
  for (let i = 0; i < a.length; i++) {
    if (a[i] % 2 === 0 && a[i-1] % 2 === 0) {
      document.write( "-" + a[i]);
    } else {
      document.write(a[i]);
    }
  }
</script>
</body>
</html>
