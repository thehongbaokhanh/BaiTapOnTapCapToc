<!DOCTYPE html>
<html lang="en">
<head>
    <title>JQuery assignment 3</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="jquery assignment 3 puzzle">
    <meta name="keywords" content="HTML,CSS,XML,JavaScript">
    <meta name="author" content="Adam Shechter">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }

        .container-fluid {
            max-width: 940px;
        }

        .puzzles {
            margin-top: 1em;
            margin: auto;
        }

        img {
            display: block;
            margin: 1em;
            padding: 0.2em;
            box-shadow: 2px 3px 3px black;
            width: 600px;
            height: 150px;
        }
    </style>

</head>
<body>
<div class="container-fluid">
    <div class="puzzles">
        <img id="img1" src="" alt=""/>
        <img id="img2" src="" alt=""/>
        <img id="img3" src="" alt=""/>
        <img id="img4" src="" alt=""/>
        <img id="img5" src="" alt=""/>
    </div>
</div>
<script type="text/javascript" src="./js/script.js"></script>
</body>
<script>
    $(document).ready(function () {

        const pieces = [
            {
                id: "#img1",
                images: [
                    "images/puzzle1_1.jpg",
                    "images/puzzle1_2.jpg",
                    "images/puzzle1_3.jpg"
                ],
                current: 0,
                correct: 1
            },
            {
                id: "#img2",
                images: [
                    "images/puzzle2_1.jpg",
                    "images/puzzle2_2.jpg",
                    "images/puzzle2_3.jpg"
                ],
                current: 0,
                correct: 2
            },
            {
                id: "#img3",
                images: [
                    "images/puzzle3_1.jpg",
                    "images/puzzle3_2.jpg",
                    "images/puzzle3_3.jpg"
                ],
                current: 0,
                correct: 0
            },
            {
                id: "#img4",
                images: [
                    "images/puzzle4_1.jpg",
                    "images/puzzle4_2.jpg",
                    "images/puzzle4_3.jpg"
                ],
                current: 0,
                correct: 1
            },
            {
                id: "#img5",
                images: [
                    "images/puzzle5_1.jpg",
                    "images/puzzle5_2.jpg",
                    "images/puzzle5_3.jpg"
                ],
                current: 0,
                correct: 2
            }
        ];

        // Khởi tạo ảnh
        pieces.forEach(piece => {
            $(piece.id).attr("src", piece.images[piece.current]);
        });

        // Click đổi ảnh
        pieces.forEach(piece => {

            $(piece.id).click(function () {

                piece.current++;

                if (piece.current >= piece.images.length) {
                    piece.current = 0;
                }

                $(this).attr("src", piece.images[piece.current]);

                checkWin();
            });

        });

        // Kiểm tra thắng
        function checkWin() {

            let win = true;

            pieces.forEach(piece => {
                if (piece.current !== piece.correct) {
                    win = false;
                }
            });

            if (win) {
                alert("🎉 Chúc mừng! Bạn đã hoàn thành Puzzle!");
            }
        }

    });
</script>
</html>
