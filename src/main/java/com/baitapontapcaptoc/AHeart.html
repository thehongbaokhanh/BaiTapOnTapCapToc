<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<pre>
<script>
    // Phần trên của trái tim
    for (let i = 1; i <= 3; i++) {

        for (let j = 1; j <= 3 - i; j++) {
            document.write(" ");
        }

        for (let j = 1; j <= 2 * i - 1; j++) {
            document.write("*");
        }

        for (let j = 1; j <= 5 - 2 * i; j++) {
            document.write(" ");
        }

        for (let j = 1; j <= 2 * i - 1; j++) {
            document.write("*");
        }

        document.write("<br>");
    }

    // Phần dưới của trái tim
    for (let i = 5; i >= 1; i--) {

        for (let j = 1; j <= 5 - i; j++) {
            document.write(" ");
        }

        for (let j = 1; j <= 2 * i - 1; j++) {
            document.write("*");
        }

        document.write("<br>");
    }
</script>
</pre>
</body>
</html>
