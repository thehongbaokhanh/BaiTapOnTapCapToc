<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<script>
    let stars = [
        "Polaris",
        "Aldebaran",
        "Deneb",
        "Vega",
        "Altair",
        "Dubhe",
        "Regulus"
    ];

    let constellations = [
        "Ursa Minor",
        "Taurus",
        "Cygnus",
        "Lyra",
        "Aquila",
        "Ursa Major",
        "Leo"
    ];

    function findConstellation(starName) {
        for (let i = 0; i < stars.length; i++) {
            if (starName === stars[i]) {
                return constellations[i];
            }
        }
        return null;
    }

    let input = prompt("Nhập tên ngôi sao:");

    let result = findConstellation(input);

    if (result) {
        document.write(
            "Ngôi sao " + input +
            " thuộc chòm sao " + result
        );
    } else {
        document.write("Không tìm thấy ngôi sao");
    }
</script>

</body>
</html>
