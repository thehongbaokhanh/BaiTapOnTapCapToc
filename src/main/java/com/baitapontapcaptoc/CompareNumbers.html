<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<script>
    function compareNumbers(a, b) {
        if (a > b) {
            alert("Tham số thứ nhất lớn hơn tham số thứ hai");
        } else {
            return a + b;
        }
    }

    let result = compareNumbers(5, 3);

    if (result !== undefined) {
        document.write(result);
    }
</script>

</body>
</html>
