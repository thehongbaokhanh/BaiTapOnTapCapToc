<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<canvas id="myCanvas" width="200" height="100" style="border:1px solid #000000;"></canvas>

</body>
<script>
    function Rectangle(width, height) {
        this.width = width;
        this.height = height;
    }

    function AreaCalculator(rectangle) {
        this.rectangle = rectangle;
        this.sum = function () {
            return this.rectangle.width * this.rectangle.height;
        }
    }

    function PerimeterCalculator(rectangle) {
        this.rectangle = rectangle;
        this.sum = function () {
            return (this.rectangle.width + this.rectangle.height) * 2;
        }
    }

    function CreateRectangle() {
        var width = document.getElementById("width").value;
        var height = document.getElementById("height").value;
        let rectangle = new Rectangle(width, height);
        let areaCalculator = new AreaCalculator(rectangle);
        let perimeterCalculator = new PerimeterCalculator(rectangle);
        document.getElementById("area").innerHTML = areaCalculator.sum();
        document.getElementById("perimeter").innerHTML = perimeterCalculator.sum();
    }

    let rectangle = new Rectangle(2, 3);
    let areaCalculator = new AreaCalculator(rectangle);
    let perimeterCalculator = new PerimeterCalculator(rectangle);
    CreateRectangle();
    console.log(areaCalculator.sum());
    console.log(perimeterCalculator.sum());
</script>
</html>
