<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let tempature = parseInt(prompt("Enter the tempature to check: "));
    if (tempature > 100) {
        alert("Too hot, please cool down!");
    }else if (tempature < 20) {
        alert("Too cold, please warm up!");
    }
</script>
</body>
</html>
