<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<p id="result"></p>
<script>
    let result = "";
    for (let i = 0; i < 20; i++) {
        if (i === 19) {
            result += fibonacci(i) + ".";
        }else {
            result += fibonacci(i) + ", ";
        }
    }
    document.getElementById("result").innerHTML = result;

    function fibonacci(n) {
        if (n === 0) {
            return 0;
        } else if (n === 1) {
            return 1;
        } else {
            return fibonacci(n - 1) + fibonacci(n - 2);
        }
    }
</script>
</body>
</html>
