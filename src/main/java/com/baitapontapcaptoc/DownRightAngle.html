<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<pre>
<script>
    for (let i = 1; i <= 5; i++) {

        for (let j = 1; j <= 5 - i; j++) {
            document.write(" ");
        }

        for (let j = 1; j <= i; j++) {
            document.write("*");
        }

        document.write("<br>");
    }
</script>
</pre>
</body>
</html>
