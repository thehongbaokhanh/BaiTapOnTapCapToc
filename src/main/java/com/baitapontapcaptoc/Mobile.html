<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mobile</title>
</head>
<body>

<script>
    function Mobile(name) {
        this.name = name;
        this.battery = 100;
        this.isOn = false;
        this.draftMessage = "";
        this.inbox = [];
        this.sentMessages = [];

        this.checkStatus = function () {
            return this.isOn;
        }

        this.turnOn = function () {
            this.isOn = true;
        }

        this.turnOff = function () {
            this.isOn = false;
        }

        this.chargeBattery = function () {
            this.battery = 100;
        }

        this.useBattery = function () {
            if (this.battery > 0) {
                this.battery--;
            }
        }

        this.composeMessage = function (message) {
            if (!this.isOn) return;

            this.draftMessage = message;
            this.useBattery();
        }

        this.sendMessage = function (mobile) {
            if (!this.isOn) return;

            mobile.receiveMessage(this.draftMessage);

            this.sentMessages.push(this.draftMessage);

            this.draftMessage = "";

            this.useBattery();
        }

        this.receiveMessage = function (message) {
            if (!this.isOn) return;

            this.inbox.push(message);

            this.useBattery();
        }

        this.viewInbox = function () {
            if (!this.isOn) return;

            this.useBattery();
            return this.inbox;
        }

        this.viewSentMessages = function () {
            if (!this.isOn) return;

            this.useBattery();
            return this.sentMessages;
        }
    }

    // Tạo 2 điện thoại
    let nokia = new Mobile("Nokia");
    let iphone = new Mobile("iPhone");

    // Bật nguồn
    nokia.turnOn();
    iphone.turnOn();

    // Soạn và gửi tin nhắn
    nokia.composeMessage("Xin chào iPhone!");
    nokia.sendMessage(iphone);

    console.log("Inbox iPhone:");
    console.log(iphone.viewInbox());

    console.log("Tin nhắn đã gửi của Nokia:");
    console.log(nokia.viewSentMessages());

    console.log("Pin Nokia:", nokia.battery);
    console.log("Pin iPhone:", iphone.battery);
</script>

</body>
</html>
