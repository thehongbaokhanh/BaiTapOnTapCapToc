<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let n = parseInt(prompt("Nhập số nguyên dương n: "));
    let prime = true;
    if (n < 2) {
        prime = false;
    } else {
        for (let i = 2; i <= Math.sqrt(n); i++) {
            if (n % i === 0) {
                prime = false;
                break;
            }
        }
    }
    if (prime) {
        alert(n + " là số nguyên tố");
    } else {
        alert(n + " không là số nguyên tố");
    }
</script>
</body>
</html>
