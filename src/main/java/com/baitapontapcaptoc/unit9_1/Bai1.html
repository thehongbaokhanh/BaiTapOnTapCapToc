<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    inputPhysic = prompt("Nhập điểm lý");
    inputChemistry = prompt("Nhập điểm hóa");
    inputbiology = prompt("Nhập điểm sinh");
    let physic = parseFloat(inputPhysic);
    let chemistry = parseFloat(inputChemistry);
    let biology = parseFloat(inputbiology);
    average = (physic + chemistry + biology) / 3;
    document.write("Điểm trung bình là: " + average);
</script>
</body>
</html>
