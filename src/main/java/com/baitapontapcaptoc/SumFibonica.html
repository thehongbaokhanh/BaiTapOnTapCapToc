<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let sum = 0;
    for (let i = 0; i < 20; i++) {
        sum += fibonacci(i);
    }
    alert("Sum of 20 first fibonacci number: " + sum);

    function fibonacci(n) {
        if (n === 0) {
            return 0;
        } else if (n === 1) {
            return 1;
        } else {
            return fibonacci(n - 1) + fibonacci(n - 2);
        }
    }
</script>
</body>
</html>
