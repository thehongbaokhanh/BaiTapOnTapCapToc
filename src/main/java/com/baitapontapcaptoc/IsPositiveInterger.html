<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function isPositiveInteger(number) {
        return Number.isInteger(number) && number > 0;
    }

    document.write(isPositiveInteger(5) + "<br>");
    document.write(isPositiveInteger(-5));
</script>
</body>
</html>
