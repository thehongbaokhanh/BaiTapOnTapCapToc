<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FactorialOfPositiveInteger</title>
</head>
<body>
<script>
    let n = parseInt(prompt("Nhập số nguyên dương:"));
    let factorial = 1;

    for (let i = 1; i <= n; i++) {
        factorial *= i;
    }

    document.write(n + "! = " + factorial);
</script>
</body>
</html>
